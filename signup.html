<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up — One Hadith</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.auth-main{padding:48px 16px 80px!important;background:radial-gradient(ellipse at 50% 0%,#e6f2e9 0,transparent 62%)}
.auth-card{width:min(100%,500px)!important;border:1px solid #dce8df!important;border-radius:26px!important;background:#fff!important;box-shadow:0 24px 70px #174b3020!important;padding:clamp(25px,6vw,46px)!important}
.auth-card h1{font-size:clamp(34px,6vw,48px)!important;line-height:1.08!important;letter-spacing:-.045em!important;color:#17251d!important}
.auth-muted{font-size:14px!important;color:#68776d!important}
.auth-form{gap:13px!important;margin-top:22px!important}
.auth-form label{color:#405247!important;font-size:13px!important}
.auth-form input{min-height:48px!important;border:1px solid #d8e2da!important;border-radius:12px!important;background:#fbfdfb!important;padding:13px 15px!important;color:#17251d!important}
.auth-form input:focus{outline:3px solid #176b4d18!important;border-color:#176b4d!important}
.auth-submit{min-height:49px!important;border-radius:13px!important;font-size:14px!important}
#googleLogin,#googleSignup{background:#fff!important;color:#26352c!important;border:1px solid #d8e2da!important;box-shadow:0 5px 16px #1420190c!important}
#googleLogin:hover,#googleSignup:hover{background:#f6faf7!important;border-color:#176b4d!important}
.auth-switch{font-size:13px!important;text-align:center!important}
@media(max-width:540px){header{height:66px!important}.auth-main{min-height:calc(100vh - 66px)!important;padding-top:25px!important}}
</style></head>
<body>
<header><a class="brand" href="./"><span>ﷲ</span> One Hadith</a><nav><a class="nav-link" href="./login.html">Login</a></nav></header>
<main class="auth-main"><section class="auth-card">
<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
<h1>Create your account.</h1><p class="auth-muted">Your Hadith reading can stay public; your account is for personal features.</p>
<button id="googleSignup" class="auth-submit" type="button" style="width:100%;margin:18px 0;padding:13px;border:1px solid #d8d4ca;border-radius:12px;background:#fff;color:#222;font:600 15px Inter,sans-serif;cursor:pointer;">Continue with Google</button>
<div style="display:flex;align-items:center;gap:12px;margin:8px 0 18px;color:#888;font-size:12px;"><span style="height:1px;background:#ddd;flex:1"></span>OR SIGN UP WITH EMAIL<span style="height:1px;background:#ddd;flex:1"></span></div>
<form id="signupForm" class="auth-form">
<label>Name<input id="name" type="text" maxlength="80" autocomplete="name" required></label>
<label>Email<input id="email" type="email" autocomplete="email" required></label>
<label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
<button class="primary auth-submit" type="submit">Create Account <b>→</b></button>
</form>
<p id="message" class="auth-message" role="status"></p>
<p class="auth-switch">Already have an account? <a href="./login.html">Login</a></p>
</section></main>
<script>
window.addEventListener("error",function(e){
 if(e.target&&e.target.tagName==="SCRIPT"){const m=document.getElementById("message");if(m){m.textContent="Sign-up service could not load. Refresh the page or try again shortly.";m.className="auth-message error";}}
},true);
</script>
<script type="module">
const form=document.getElementById("signupForm"),msg=document.getElementById("message"),googleButton=document.getElementById("googleSignup"),submitButton=form.querySelector('button[type="submit"]');
function show(text,ok=false){msg.textContent=text;msg.className="auth-message "+(ok?"ok":"error");}
function busy(button,on,label){button.disabled=on;if(label)button.textContent=label;}
try{
 const {supabase,ensureProfile}=await import("./auth.js");
 googleButton.addEventListener("click",async()=>{
  busy(googleButton,true,"Connecting to Google…");show("Connecting to Google…");
  try{const {error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:new URL("./profile.html",location.href).href}});
   if(error)show(error.message);
  }catch(error){show(error?.message||"Google sign-up could not start.");}
  finally{busy(googleButton,false,"Continue with Google");}
 });
 form.addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
  if(password!==confirm){show("Passwords do not match.");return;}
  busy(submitButton,true,"Creating account…");show("Creating your account…");
  try{
   const {data,error}=await supabase.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:new URL("./profile.html",location.href).href}});
   if(error){show(error.message);return;}
   if(data.user&&data.session){
    const profile=await ensureProfile(data.user,name);
    if(profile.error){show("Account created, but profile setup failed: "+profile.error.message);return;}
    location.href="./profile.html";return;
   }
   show("Account created. Please check your email and confirm your account before logging in.",true);
  }catch(error){show(error?.message||"Sign-up failed. Please try again.");}
  finally{busy(submitButton,false,"Create Account →");}
 });
}catch(error){show("Sign-up service could not start: "+(error?.message||"Please refresh and try again."));}
</script>
</body></html>
