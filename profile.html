<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — One Hadith</title><link rel="stylesheet" href="style.css">
</head>
<body><header><a class="brand" href="./"><span>ﷲ</span> One Hadith</a><nav><button class="nav-link" id="logout">Logout</button></nav></header>
<main class="auth-main"><section class="auth-card">
<div class="eyebrow">My account</div><h1 id="hello">Account</h1><p id="email" class="auth-muted"></p>
<section class="reading-feature" aria-labelledby="readingTitle">
  <div class="reading-feature-top"><span class="reading-feature-icon" aria-hidden="true">✦</span><span class="reading-feature-label">A MOMENT OF REFLECTION</span></div>
  <h2 id="readingTitle">Your next Hadith is waiting.</h2>
  <p>Take a quiet moment. Read one Hadith, understand its message, and carry one good lesson into your day.</p>
  <a class="reading-cta" href="./?start=1"><span>Start reading</span><span class="reading-cta-circle" aria-hidden="true">→</span></a>
  <div class="reading-feature-foot"><span>One Hadith at a time</span><span>♡</span></div>
</section>
<form id="profileForm" class="auth-form">
<label>Display name<input id="name" type="text" maxlength="80" autocomplete="name"></label>
<button class="primary auth-submit" type="submit">Save Profile <b>✓</b></button>
</form>
<p id="message" class="auth-message" role="status"></p>
<div id="adminBox" class="admin-note" hidden>Admin access is enabled for this account.</div>
</section></main>
<script type="module">
import { supabase, ensureProfile } from "./auth.js";
const msg=document.getElementById("message");
function show(t,ok=false){msg.textContent=t;msg.className="auth-message "+(ok?"ok":"error");}
const {data:{user}}=await supabase.auth.getUser();
if(!user){location.href="./login.html";throw new Error("Not authenticated");}
const {data:profile,error}=await ensureProfile(user);
if(error){show("Could not load your profile: "+error.message);throw error;}
document.getElementById("hello").textContent="Hello, "+(profile.display_name||user.email.split("@")[0])+".";
document.getElementById("email").textContent=user.email;
document.getElementById("name").value=profile.display_name||"";
if(profile.role==="admin"){document.getElementById("adminBox").hidden=false;document.getElementById("adminBox").innerHTML='Admin access is enabled. <a href="./admin.html" style="color:inherit;font-weight:900">Open Admin Dashboard →</a>';}
document.getElementById("profileForm").addEventListener("submit",async e=>{
 e.preventDefault();const name=document.getElementById("name").value.trim();
 const {error}=await supabase.from("profiles").update({display_name:name}).eq("id",user.id);
 if(error){show(error.message);return;}show("Profile saved.",true);
});
document.getElementById("logout").addEventListener("click",async()=>{await supabase.auth.signOut();location.href="./";});
</script></body></html>
