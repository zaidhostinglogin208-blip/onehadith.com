<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — One Hadith</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.auth-main{padding:48px 16px 80px!important;background:radial-gradient(ellipse at 50% 0%,#e6f2e9 0,transparent 62%)}
.auth-card{width:min(100%,500px)!important;border:1px solid #dce8df!important;border-radius:26px!important;background:#fff!important;box-shadow:0 24px 70px #174b3020!important;padding:clamp(25px,6vw,46px)!important}
.auth-card h1{font-size:clamp(34px,6vw,48px)!important;line-height:1.08!important;letter-spacing:-.045em!important;color:#17251d!important}
.auth-muted{font-size:14px!important;color:#68776d!important}
.auth-form{gap:13px!important;margin-top:22px!important}
.auth-form label{color:#405247!important;font-size:13px!important}
.auth-form input{min-height:48px!important;border:1px solid #d8e2da!important;border-radius:12px!important;background:#fbfdfb!important;padding:13px 15px!important;color:#17251d!important}
.auth-form input:focus{outline:3px solid #176b4d18!important;border-color:#176b4d!important}
.auth-submit{min-height:49px!important;border-radius:13px!important;font-size:14px!important}
#googleLogin,#googleSignup{background:#fff!important;color:#26352c!important;border:1px solid #d8e2da!important;box-shadow:0 5px 16px #1420190c!important}
#googleLogin:hover,#googleSignup:hover{background:#f6faf7!important;border-color:#176b4d!important}
.auth-switch{font-size:13px!important;text-align:center!important}
@media(max-width:540px){header{height:66px!important}.auth-main{min-height:calc(100vh - 66px)!important;padding-top:25px!important}}
</style></head>
<body>
<header><a class="brand" href="./"><span>ﷲ</span> One Hadith</a><nav><a class="nav-link" href="./signup.html">Sign Up</a></nav></header>
<main class="auth-main"><section class="auth-card">
<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
<h1>Welcome back.</h1><p class="auth-muted">Login to access your One Hadith account.</p>
<button id="googleLogin" class="auth-submit" type="button" style="width:100%;margin:18px 0;padding:13px;border:1px solid #d8d4ca;border-radius:12px;background:#fff;color:#222;font:600 15px Inter,sans-serif;cursor:pointer;">Continue with Google</button>
<div style="display:flex;align-items:center;gap:12px;margin:8px 0 18px;color:#888;font-size:12px;"><span style="height:1px;background:#ddd;flex:1"></span>OR CONTINUE WITH EMAIL<span style="height:1px;background:#ddd;flex:1"></span></div>
<form id="loginForm" class="auth-form">
<label>Email<input id="email" type="email" autocomplete="email" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
<button class="primary auth-submit" type="submit">Login <b>→</b></button>
</form>
<button id="forgot" class="text-button" type="button">Forgot password?</button>
<p id="message" class="auth-message" role="status"></p>
<p class="auth-switch">New here? <a href="./signup.html">Create an account</a></p>
</section></main>
<script type="module">
import { supabase, ensureProfile } from "./auth.js";
const form=document.getElementById("loginForm"), msg=document.getElementById("message");
function show(text,ok=false){msg.textContent=text;msg.className="auth-message "+(ok?"ok":"error");}
document.getElementById("googleLogin").addEventListener("click",async()=>{
 show("Connecting to Google…");
 const {error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname.replace("login.html","profile.html")}});
 if(error)show(error.message);
});
form.addEventListener("submit",async e=>{
  e.preventDefault(); show("Logging in…");
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error){show(error.message);return;}
  await ensureProfile(data.user);
  location.href="./profile.html";
});
document.getElementById("forgot").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();
  if(!email){show("Enter your email first.");return;}
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace("login.html","reset.html")});
  if(error){show(error.message);return;}
  show("If the email is eligible, a password reset message has been sent.",true);
});
</script>
</body></html>
